# `docker-compose.override.yml` should contain settings for local development
# to override the ones contained in `docker-compose.yml`

services:
  web-app:
    env_file: !override
      - .env.docker # Use a different .env file when running via docker
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
    command: ['python', 'manage.py', 'runserver', '0.0.0.0:8000']
    ports:
      - 8000:8000
      - 8001:5678 # For debugging
    volumes:
      - .:/app # Mount the project directory to avoid image rebuilding
      - .env.docker:/app/.env

  celery-worker:
    env_file: !override
      - .env.docker
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local

  celery-beat:
    env_file: !override
      - .env.docker
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local

  flower:
    env_file: !override
      - .env.docker
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local

  nginx:
    image: nsorokopud/django_articles:nginx-http-local
    build:
      context: ./nginx
      args:
        NGINX_TEMPLATE: http
    env_file: !override
      - .env.docker
    ports: !override
      - 80:80

  db:
    ports:
      - 5432:5432

  redis:
    ports:
      - 6379:6379
