services:
  web-app:
    image: nsorokopud/django_articles:web-app
    build: .
    restart: 'unless-stopped'
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    expose:
      - 8000
    volumes:
      - media-volume:/app/media/
      - static-volume:/app/staticfiles/
      - logs-volume:/app/logs/
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=3).close()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:17.10-alpine
    restart: 'unless-stopped'
    expose:
      - 5432
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - db-volume:/var/lib/postgresql/data/
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  celery-worker:
    image: nsorokopud/django_articles:web-app
    build: .
    stop_grace_period: 1m
    restart: 'unless-stopped'
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    command: ['celery', '-A', 'config', 'worker', '-l', 'INFO']
    volumes:
      - media-volume:/app/media/
      - logs-volume:/app/logs/
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    image: nsorokopud/django_articles:web-app
    build: .
    restart: 'unless-stopped'
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    command:
      [
        'celery',
        '-A',
        'config',
        'beat',
        '-l',
        'INFO',
        '--schedule=/app/celerybeat/celerybeat-schedule',
      ]
    volumes:
      - logs-volume:/app/logs/
      - celery-beat-volume:/app/celerybeat/
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    restart: 'unless-stopped'
    expose:
      - 6379
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10

  flower:
    image: nsorokopud/django_articles:web-app
    build: .
    restart: 'unless-stopped'
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH:?FLOWER_BASIC_AUTH is required}
    command: ['celery', '-A', 'config', 'flower', '--url-prefix=__flower__']
    ports:
      - 127.0.0.1:5555:5555
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_started

  nginx:
    image: nsorokopud/django_articles:nginx
    build:
      context: ./nginx
      args:
        NGINX_TEMPLATE: https
    restart: 'unless-stopped'
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:?DOMAIN_NAME is required}
      SSL_CERT_PATH: /etc/letsencrypt/live/${DOMAIN_NAME:?DOMAIN_NAME is required}/fullchain.pem
      SSL_CERT_KEY_PATH: /etc/letsencrypt/live/${DOMAIN_NAME:?DOMAIN_NAME is required}/privkey.pem
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:?CERTBOT_EMAIL is required}
    ports:
      - 80:80
      - 443:443
    depends_on:
      web-app:
        condition: service_healthy
    volumes:
      - media-volume:/app-media/
      - static-volume:/static/
      - ssl-cert-volume:/etc/letsencrypt/

volumes:
  db-volume:
  logs-volume:
  media-volume:
  static-volume:
  celery-beat-volume:
  ssl-cert-volume:
