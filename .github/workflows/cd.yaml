name: Continuous Deployment

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  build_images:
    runs-on: ubuntu-latest
    name: Build Docker Images

    env:
      # Build-only placeholders required for Compose interpolation
      DB_NAME: django_articles_build
      DB_USER: postgres
      DB_PASSWORD: build-password

      DOMAIN_NAME: example.com
      CERTBOT_EMAIL: admin@example.com

      FLOWER_BASIC_AUTH: build-user:build-password

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build images
        run: docker compose -f docker-compose.yaml build web-app nginx

      - name: Push images
        run: docker compose -f docker-compose.yaml push web-app nginx

  deploy:
    environment: production
    runs-on: ubuntu-latest
    name: Deployment
    needs: [build_images]

    steps:
      - uses: actions/checkout@v4

      - name: Send deployment files to the server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          port: 22
          source: 'docker-compose.yaml,Makefile'
          target: '/projects/django_articles'
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          port: 22
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          command_timeout: 30m
          script: |
            set -eu

            cd /projects/django_articles

            # Applies to every direct `docker compose` command below.
            # The Makefile also explicitly uses -f docker-compose.yaml.
            export COMPOSE_FILE=docker-compose.yaml

            docker compose config --quiet

            printf '%s' "$DOCKERHUB_TOKEN" |
              docker login --username "$DOCKERHUB_USERNAME" --password-stdin

            docker compose pull web-app nginx

            docker compose up -d db redis

            make prod-wait-db
            make prod-check-deploy
            make prod-migrate
            make prod-collectstatic

            docker compose up -d --wait --wait-timeout 180

            docker image prune -f
