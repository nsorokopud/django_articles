{% extends "users/form_base.html" %}
{% load crispy_forms_tags socialaccount %}

{% block form %}
  <form class="user-form" method="post">
    {% csrf_token %}
    <fieldset>
      <div class="form-group">
        <legend class="mb-4">Log In</legend>
        {{ form|crispy }}
      </div>
    </fieldset>
    <div class="form-group d-flex flex-column flex-sm-row justify-content-start">
      <button class="btn btn-success mb-3 mb-sm-0 me-sm-3" type="submit">
        Log In
      </button>
      <a href="{% url 'password-reset' %}" class="btn btn-secondary">Reset Password</a>
    </div>
  </form>

  <div class="form-group">
    <h5 class="text-center mb-3">Or</h5>

    <form method="post" action="{% provider_login_url 'google' %}">
      {% csrf_token %}
      <button type="submit" class="google-btn">
        <img src="https://img.icons8.com/color/48/000000/google-logo.png"
             alt="Google Logo"
             height="30px"
             width="30px">
        <span>Sign in with Google</span>
      </button>
    </form>
  </div>
{% endblock form %}

{% block form-after %}
  <div class="border-top mt-3">
    <small class="text-muted">
      Need an account?
      <a href="{% url 'registration' %}" class="link-green mx-2">Sign Up</a>
    </small>
  </div>
{% endblock form-after %}
